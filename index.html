<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev 1 - Nav Bar + Hero Section</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-800 font-sans">

  <!-- Navbar -->
  <header class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between">
    <div class="text-xl font-bold tracking-tight">Acme<span class="text-indigo-600">*</span></div>
    <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-600">
      <a href="#" class="text-indigo-600">Home</a>
      <a href="#" class="hover:text-gray-900">Features</a>
      <a href="#" class="hover:text-gray-900">Pricing</a>
      <a href="#" class="hover:text-gray-900">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="max-w-5xl mx-auto px-6 pt-12 pb-20 text-center flex flex-col items-center">
    <!-- Rainbow Tag / Badge -->
    <div class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-600 text-xs font-semibold mb-6 shadow-sm">
      <span>🌈</span>
      <span>Acme Productivity App</span>
    </div>

    <!-- Main Heading -->
    <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-gray-900 mb-4">
      Boost Your <span class="text-indigo-600">Productivity</span>
    </h1>
    
    <!-- Subtitle -->
    <p class="text-lg text-gray-600 mb-8 max-w-xl mx-auto">
      Streamline your workflow with our all-in-one productivity app.
    </p>
    
    <!-- CTA Button -->
    <a href="#" class="inline-block bg-gray-900 text-white font-medium px-6 py-3 rounded-lg hover:bg-gray-800 transition">
      Start Free Trial
    </a>
  </section>

</body>
</html>
